<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwerty Update</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #030712;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Container Logo */
        .logo-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .cloud-svg {
            width: 100%;
            height: 100%;
        }

        /* Outline Glow RGB yang Menjalar */
        .cloud-glow {
            fill: none;
            stroke-width: 1.2;
            stroke-linecap: round;
            /* Membuat efek garis menjalar */
            stroke-dasharray: 25 45;
            animation: travel 4s linear infinite, rgbColor 8s linear infinite;
        }

        /* Bagian Dalam Awan */
        .cloud-main {
            fill: #0b1329;
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 0.8;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.5));
        }

        /* Teks Status */
        .status-text {
            color: #f8fafc;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Animasi Aliran Garis Menjalar */
        @keyframes travel {
            0% {
                stroke-dashoffset: 0;
            }
            100% {
                stroke-dashoffset: -70;
            }
        }

        /* Animasi Transisi Warna RGB */
        @keyframes rgbColor {
            0%, 100% {
                stroke: #ff0055;
                filter: drop-shadow(0 0 3px #ff0055) drop-shadow(0 0 8px #ff0055);
            }
            25% {
                stroke: #00ff66;
                filter: drop-shadow(0 0 3px #00ff66) drop-shadow(0 0 8px #00ff66);
            }
            50% {
                stroke: #00ffff;
                filter: drop-shadow(0 0 3px #00ffff) drop-shadow(0 0 8px #00ffff);
            }
            75% {
                stroke: #9b51e0;
                filter: drop-shadow(0 0 3px #9b51e0) drop-shadow(0 0 8px #9b51e0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-wrapper">
            <!-- viewBox disesuaikan biar glow di luar sisi awan gak kepotong -->
            <svg class="cloud-svg" viewBox="-4 -4 32 32" xmlns="http://www.w3.org/2000/svg">
                <!-- Path Glow RGB (Di Belakang) -->
                <path class="cloud-glow" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
                <!-- Path Utama Awan (Di Depan) -->
                <path class="cloud-main" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
            </svg>
        </div>
        
        <h1 class="status-text">Qwerty Sedang Update...</h1>
    </div>

</body>
</html>
