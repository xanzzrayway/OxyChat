<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Api Key OxyChat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<button id="back-btn" onclick="goBack()" aria-label="Kembali">
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4l-6 5 6 5"/></svg>
</button>

<h1>Api Key OxyChat</h1>

<div class="section-label">Command cURL</div>
<div class="desc">Contoh perintah buat test model Spectrax pake API key kamu:</div>
<div id="curl-box">
  <pre id="curl-code"></pre>
  <button id="curl-copy-btn" onclick="copyCurl()">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.5"/><path d="M10.5 5.5V3.5A1.5 1.5 0 009 2H3.5A1.5 1.5 0 002 3.5V9a1.5 1.5 0 001.5 1.5h2"/></svg>
  </button>
</div>

<div class="section-label">Buat Api Key Oxy</div>
<input id="name-input" type="text" placeholder="Nama Api (misal: App Pribadi)" maxlength="60" autocomplete="off">
<select id="model-select"></select>
<button id="create-btn" onclick="createApiKey()">Buat</button>

<div id="result-box">
  <div id="result-value"></div>
  <button id="result-copy-btn" onclick="copyResult()">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.5"/><path d="M10.5 5.5V3.5A1.5 1.5 0 009 2H3.5A1.5 1.5 0 002 3.5V9a1.5 1.5 0 001.5 1.5h2"/></svg>
  </button>
</div>

<div class="section-label">Riwayat Api</div>
<div id="history-list"></div>

<div id="toast"></div>

<script src="app-472eec6fc20e.js"></script>
</body>
